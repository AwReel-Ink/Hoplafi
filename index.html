<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ON · Hoplàfi !</title>
<meta name="description" content="Envoyez des fichiers entre vos appareils, directement, sans serveur.">
<meta name="theme-color" content="#1D4ED8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" id="favicon" href="icons/fav-on.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoplàfi !">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="logo">Hoplàfi&nbsp;!</div>
    <div class="me" id="me"></div>
    <div class="timer-top" id="timer-top"></div>
    <button type="button" class="toggle" id="toggle" aria-pressed="true">ON</button>
  </header>
  <div class="layout">
    <main class="main" id="main"></main>
    <aside class="side" id="side"></aside>
  </div>
  <footer class="footer"><span id="version"></span></footer>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<input type="file" id="pick-files" multiple hidden>
<input type="file" id="pick-dir" webkitdirectory multiple hidden>
<noscript><p style="padding:24px;font-family:sans-serif">Hoplàfi ! a besoin de JavaScript pour fonctionner.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
